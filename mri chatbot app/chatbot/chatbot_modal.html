<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style lang="scss">
      .chatbot {
        position: fixed;
        bottom: 4.5%;
        right: 4.5%;
        background-color: #fff;
        height: 500px;
        width: 350px;
        border: 5px solid #4a4e69;
        border-radius: 50px;
        box-shadow: 0px 0px 5px #2f2f2f;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
      }
      .closechatbutton {
        position: absolute;
        z-index: 2;
        top: -2.5%;
        right: -2.5%;
        height: 45px;
        width: 45px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        box-shadow: 0px 0px 5px #2f2f2f;
        border: 5px solid #4a4e69;
        background-color: #fff;
        justify-content: center;
      }
      .closeicon {
        height: 35px;
        transition: transform 0.8s ease-in-out;
      }
      .closeicon:hover {
        transform: rotate(360deg); /* Rotate 360 degrees */
      }
      .messagebot {
        min-height: 70%;
        max-height: 70%;
        overflow-y: scroll;
        width: 100%;
        padding: 20px 20px;
      }
      .userprompt {
        height: 30%;
        width: 100%;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        padding: 20px 20px;
        gap: 20px;
        border-top: 1px solid #2f2f2f;
        background-color: #4a4e6952;
        border-bottom-right-radius: 40px;
        border-bottom-left-radius: 40px;
      }
      textarea {
        resize: none;
        border-radius: 25px;
        padding: 10px 10px;
        border: 1px solid #4a4e69;
        background-color: #ffffffa0;
      }
      textarea:focus {
        border: 2px solid #4a4e69;
        outline: none;
      }
      .buttonsend {
        border: none;
        background-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="chatbotModal" class="chatbot">
      <div class="messagebot" id="chatbotResponse"></div>
      <div class="userprompt">
        <textarea
          id="userPrompt"
          rows="3"
          cols="50"
          placeholder="Type your question here..."
        ></textarea>
        <button id="sendPrompt" class="buttonsend">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
            <g
              id="SVGRepo_tracerCarrier"
              stroke-linecap="round"
              stroke-linejoin="round"
            ></g>
            <g id="SVGRepo_iconCarrier">
              <path
                d="M20.7639 12H10.0556M3 8.00003H5.5M4 12H5.5M4.5 16H5.5M9.96153 12.4896L9.07002 15.4486C8.73252 16.5688 8.56376 17.1289 8.70734 17.4633C8.83199 17.7537 9.08656 17.9681 9.39391 18.0415C9.74792 18.1261 10.2711 17.8645 11.3175 17.3413L19.1378 13.4311C20.059 12.9705 20.5197 12.7402 20.6675 12.4285C20.7961 12.1573 20.7961 11.8427 20.6675 11.5715C20.5197 11.2598 20.059 11.0295 19.1378 10.5689L11.3068 6.65342C10.2633 6.13168 9.74156 5.87081 9.38789 5.95502C9.0808 6.02815 8.82627 6.24198 8.70128 6.53184C8.55731 6.86569 8.72427 7.42461 9.05819 8.54246L9.96261 11.5701C10.0137 11.7411 10.0392 11.8266 10.0493 11.9137C10.0583 11.991 10.0582 12.069 10.049 12.1463C10.0387 12.2334 10.013 12.3188 9.96153 12.4896Z"
                stroke="#4a4e69"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              ></path>
            </g>
          </svg>
        </button>
      </div>
      <button id="closeChatbot" class="closechatbutton">
        <svg
          viewBox="0 0 1024 1024"
          xmlns="http://www.w3.org/2000/svg"
          fill="#000000"
          class="closeicon"
        >
          <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
          <g
            id="SVGRepo_tracerCarrier"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></g>
          <g id="SVGRepo_iconCarrier">
            <path
              fill="#4a4e69"
              d="M195.2 195.2a64 64 0 0 1 90.496 0L512 421.504 738.304 195.2a64 64 0 0 1 90.496 90.496L602.496 512 828.8 738.304a64 64 0 0 1-90.496 90.496L512 602.496 285.696 828.8a64 64 0 0 1-90.496-90.496L421.504 512 195.2 285.696a64 64 0 0 1 0-90.496z"
            ></path>
          </g>
        </svg>
      </button>
    </div>
  </body>
</html>
